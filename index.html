<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3a342f">
  <title>Desk Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="src/operations.js" defer></script>
  <script src="src/calculator.js" defer></script>
  <script src="src/ui.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1 class="calculator__badge">Desk <span>12</span></h1>

    <section class="display" aria-label="Display">
      <div class="display__expression" id="expression"></div>
      <div class="display__result" id="result" data-size="xl" aria-live="polite" aria-atomic="true">0</div>
    </section>

    <div class="keys" id="keys">
      <button class="key key--function key--wide" data-action="clear" aria-label="Clear">AC</button>
      <button class="key key--function" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key key--operator" data-action="operator" data-value="/" aria-label="Divide" aria-pressed="false">÷</button>

      <button class="key" data-action="digit" data-value="7">7</button>
      <button class="key" data-action="digit" data-value="8">8</button>
      <button class="key" data-action="digit" data-value="9">9</button>
      <button class="key key--operator" data-action="operator" data-value="*" aria-label="Multiply" aria-pressed="false">×</button>

      <button class="key" data-action="digit" data-value="4">4</button>
      <button class="key" data-action="digit" data-value="5">5</button>
      <button class="key" data-action="digit" data-value="6">6</button>
      <button class="key key--operator" data-action="operator" data-value="-" aria-label="Subtract" aria-pressed="false">−</button>

      <button class="key" data-action="digit" data-value="1">1</button>
      <button class="key" data-action="digit" data-value="2">2</button>
      <button class="key" data-action="digit" data-value="3">3</button>
      <button class="key key--operator" data-action="operator" data-value="+" aria-label="Add" aria-pressed="false">+</button>

      <button class="key key--wide" data-action="digit" data-value="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <footer class="hint">
    <span><kbd>0–9</kbd> <kbd>.</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd></span>
    <span><kbd>Enter</kbd> equals</span>
    <span><kbd>Backspace</kbd> undo</span>
    <span><kbd>Esc</kbd> clear</span>
  </footer>
</body>
</html>
